name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm install` instead of `npm ci`: npm never records the optional wasm peer deps
      # (@emnapi/* of @rolldown/binding-wasm32-wasi) in the lockfile, so `npm ci` rejects it as
      # out of sync on Linux. `npm install` still honours the lockfile and the pinned versions.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

      # PWA build (dist/) plus the offline single-file build, published next to it
      # so it can be downloaded from <site>/sys-viz.html
      - run: npm run build
      - run: npm run build:single
      - run: cp dist-single/sys-viz.html dist/sys-viz.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
