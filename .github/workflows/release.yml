name: Release offline HTML

# Pushing a tag like v1.2.3 builds the single-file app and attaches it to a GitHub release,
# so it can always be downloaded from
# https://github.com/<owner>/sys-viz/releases/latest/download/sys-viz.html

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)" >&2
            exit 1
          fi

      # Same reason as deploy-pages.yml for `npm install` instead of `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:single

      - name: Create release with sys-viz.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-single/sys-viz.html \
            --title "sys-viz $GITHUB_REF_NAME" \
            --generate-notes
